<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Portal Event Yakult</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="loginpage">

  <header class="header_title">Login Portal Event PT Yakult Indonesia Persada</header>

  <div class="loginBox" id="loginform">
    <h2>Silakan Login</h2>
    <input class="input_box" type="text" id="username" placeholder="Username">
    <input class="input_box" type="password" id="password" placeholder="Password">
    <button class="btn" onclick="login()">Login</button>
    <p id="loginMsg" class="error"></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
